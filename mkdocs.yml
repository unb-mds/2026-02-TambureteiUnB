site_name: Tamburetei UnB
site_description: Documentação Oficial do Tamburetei UnB — Métodos de Desenvolvimento de Software (MDS 2026/2 - FCTE/UnB)
site_author: Grupo G9 — MDS UnB
repo_name: unb-mds/2026-02-TambureteiUnB
repo_url: https://github.com/unb-mds/2026-02-TambureteiUnB

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - python
    - yaml
    - bash
    - sql
    - json

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Início: documento-visao.md
  - Requisitos do Sistema: requisitos.md
  - Histórias de Usuário do Backend: historias_usuario_backend.md
  - Histórias de Usuário do Frontend: historias_usuario_frontend.md
  - Histórias de Usuário do Banco de Dados: historias_usuario_database.md
  - Arquitetura & Banco de Dados: arquitetura.md
  - Regras de Negócio & Governança: regras_negocio.md
  - Guia de Desenvolvimento: desenvolvimento.md
