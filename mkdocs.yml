site_name: Tamburetei UnB
site_description: Documentação Oficial do Tamburetei UnB — Métodos de Desenvolvimento de Software (MDS 2026/2 - FCTE/UnB)
site_author: Grupo G9 — MDS UnB
repo_name: unb-mds/2026-02-TambureteiUnB
repo_url: https://github.com/unb-mds/2026-02-TambureteiUnB

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - python
    - yaml
    - bash
    - sql
    - json

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Documento de Visão: index.md
  - Planejamento & Requisitos:
      - Requisitos do Sistema: requisitos.md
      - Regras de Negócio & Governança: regras_negocio.md
  - Arquitetura & Banco de Dados:
      - Arquitetura do Sistema & ADRs: arquitetura.md
      - Dicionário de Dados Relacional: banco_de_dados.md
  - Engenharia de Dados & ETL:
      - Pipeline de Dados & ETL: pipeline_etl.md
      - Como Popular o Banco de Dados: popular_banco_de_dados.md
  - Histórias de Usuário:
      - Backend: historias_usuario_backend.md
      - Frontend: historias_usuario_frontend.md
      - Banco de Dados: historias_usuario_database.md
  - Guia do Desenvolvedor: desenvolvimento.md
