services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      MATERIALS_DIR: /app/storage/materiais
      MATERIAL_MAX_BYTES: ${MATERIAL_MAX_BYTES:-5242880}
    volumes:
      - ./backend:/app
      - materiais_data:/app/storage/materiais
    depends_on:
      - db

  adminer:
    image: adminer
    restart: always
    ports:
      - "${ADMINER_PORT:-8085}:8080"
    depends_on:
      - db

volumes:
  pgdata:
  materiais_data:
